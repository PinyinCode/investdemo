name: Update Realtime Prices

on:
  schedule:
    # Chạy mỗi 10 phút, 9:00–15:00 giờ VN (T2–T6)
    # Giờ UTC: 2:00–8:00
    - cron: '*/10 2-8 * * 1-5'
  workflow_dispatch:  # Cho phép chạy thủ công từ tab Actions

permissions:
  contents: write

concurrency:
  group: realtime-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "lotusmarket[fetchers]"

      - name: Run realtime update
        env:
          PYTHONUNBUFFERED: 1  # Ép Python in log ngay lập tức lên GitHub
        run: python update_realtime.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Chỉ add những file tồn tại, tránh lỗi pathspec did not match
          [ -f data.json ] && git add data.json
          [ -f last_update.json ] && git add last_update.json
          [ -f realtime_meta.json ] && git add realtime_meta.json

          if git diff --staged --quiet; then
            echo "ℹ️ Không có thay đổi — bỏ qua commit."
            exit 0
          fi

          git commit -m "chore: realtime update $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          # Đồng bộ với remote trước khi push để tránh bị reject
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo "### 📊 Kết quả cập nhật realtime" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f realtime_meta.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat realtime_meta.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Không tìm thấy realtime_meta.json (script có thể chưa chạy xong)." >> $GITHUB_STEP_SUMMARY
          fi

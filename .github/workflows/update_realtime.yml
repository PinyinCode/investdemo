name: Update Realtime Prices

on:
  schedule:
    # Chạy mỗi 10 phút, từ 9:00 đến 15:00 (giờ VN, UTC+7)
    # GitHub Actions dùng UTC → 2:00-8:00 UTC = 9:00-15:00 VN
    # T2-T6
    - cron: '*/10 2-8 * * 1-5'
  workflow_dispatch:  # Cho phép chạy thủ công từ tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "lotusmarket[fetchers]"

      - name: Run realtime update
        run: python update_realtime.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data.json realtime_meta.json
          
          if git diff --staged --quiet; then
            echo "ℹ️ Không có thay đổi."
            exit 0
          fi
          
          git commit -m "chore: realtime update $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          
          # Pull rebase để tránh conflict nếu có commit khác xen vào
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

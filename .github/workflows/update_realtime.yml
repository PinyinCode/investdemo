name: Update Realtime Prices

on:
  schedule:
    # Chạy mỗi 30 phút, từ 8:30 sáng đến 15:30 chiều (giờ VN)
    # 8:30 VN = 1:30 UTC | 15:30 VN = 8:30 UTC
    # Cú pháp: Phút 0 và 30, Giờ từ 1 đến 8, Thứ 2 đến Thứ 6
    - cron: '0,30 1-8 * * 1-5'
  workflow_dispatch:  # Cho phép chạy thủ công từ tab Actions

permissions:
  contents: write

concurrency:
  group: realtime-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "lotusmarket[fetchers]"

      - name: Run realtime update
        env:
          PYTHONUNBUFFERED: 1
        run: python update_realtime.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          [ -f data.json ] && git add data.json
          [ -f last_update.json ] && git add last_update.json

          if git diff --staged --quiet; then
            echo "ℹ️ Không có thay đổi — bỏ qua commit."
            exit 0
          fi

          git commit -m "chore: realtime update $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo "### 📊 Kết quả cập nhật realtime" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Thời gian chạy:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -f last_update.json ]; then
            echo "**Mốc cập nhật dữ liệu (VN):** $(python -c 'import json; print(json.load(open("last_update.json")).get("last_update", "N/A"))')" >> $GITHUB_STEP_SUMMARY
          fi

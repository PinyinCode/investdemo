name: Fix Trading Date

on:
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  fix-date:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pymongo

    - name: Run fix date script
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }} # Tự động lấy từ Secret
      run: python fix_date.py

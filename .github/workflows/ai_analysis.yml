name: 2. Run AI Deep Analysis

on:
  # Có thể đặt lịch chạy sau Workflow 1 (ví dụ: 02:00 sáng thứ Sáu)
  schedule:
    - cron: '30 18 * * 5'
  workflow_dispatch: # Cho phép bấm chạy thủ công độc lập bất cứ lúc nào

jobs:
  ai-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AI Deep Analysis (Top 3 mỗi ngành)
        env:
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
          PYTHONUNBUFFERED: 1
        run: python analyze_ai.py

      - name: Commit and push AI results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [AI Analysis] Cập nhật phân tích chuyên sâu Top 3 [$(date +'%Y-%m-%d')]" && git push)

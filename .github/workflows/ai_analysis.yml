name: 2. Run AI Deep Analysis

on:
  schedule:
    - cron: '30 18 * * 5'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Nhập mã cổ phiếu cần phân tích (cách nhau bằng dấu phẩy, để trống nếu muốn chạy tự động theo Top ngành)'
        required: false
        default: ''
        type: string

jobs:
  ai-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AI Deep Analysis
        env:
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
          INPUT_SYMBOLS: ${{ inputs.symbols }}
          PYTHONUNBUFFERED: 1
        run: python analyze_ai.py

      - name: Commit and push AI results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [AI Analysis] Cập nhật phân tích thủ công cho các mã: ${{ inputs.symbols || 'Top ngành tự động' }} [$(date +'%Y-%m-%d')]" && git push)

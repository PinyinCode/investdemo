name: 2. Run AI Deep Analysis

on:
  schedule:
    - cron: '30 18 * * 5'   # 1h30 sáng thứ 7 giờ VN
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Nhập mã cổ phiếu cần phân tích (cách nhau bằng dấu phẩy). Để trống nếu muốn chạy theo Top ngành.'
        required: false
        default: ''
        type: string
      mode:
        description: 'Chế độ chạy'
        required: true
        default: 'top'
        type: choice
        options:
          - top      # Chỉ chạy top đầu mỗi ngành
          - rest     # Chỉ chạy phần còn lại (chia batch)
          - all      # Chạy cả top và batch hiện tại của phần còn lại
      batch:
        description: 'Batch hiện tại (chỉ dùng cho mode=rest hoặc all)'
        required: false
        default: '1'
        type: string
      total_batches:
        description: 'Tổng số batch chia phần còn lại'
        required: false
        default: '1'
        type: string
      force:
        description: 'Ép phân tích lại (bỏ qua resume 7 ngày)'
        required: false
        default: false
        type: boolean
      use_ai:
        description: 'Chế độ phân tích'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'   # Tự động: có key → AI, không key → template
          - 'yes'    # Bắt buộc dùng AI
          - 'no'     # Chỉ dùng template (miễn phí)

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # NHÁNH 1: TEMPLATE (KHÔNG AI)
      # Chạy khi: user chọn 'no' HOẶC (không phải 'yes' và không có key)
      # ============================================================
      - name: Run Analysis (TEMPLATE — NO AI)
        if: |
          inputs.use_ai == 'no' ||
          (inputs.use_ai != 'yes' && secrets.ALIBABA_API_KEY == '')
        env:
          INPUT_SYMBOLS: ${{ inputs.symbols }}
          PYTHONUNBUFFERED: 1
          MODE: ${{ inputs.mode || 'top' }}
          BATCH: ${{ inputs.batch || '1' }}
          TOTAL_BATCHES: ${{ inputs.total_batches || '1' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          # ❗ Không truyền ALIBABA_API_KEY trong nhánh này
        run: |
          echo "=========================================="
          echo "📝 CHẾ ĐỘ: TEMPLATE (miễn phí, KHÔNG dùng AI)"
          echo "  Mode        : $MODE"
          echo "  Batch       : $BATCH/$TOTAL_BATCHES"
          echo "  Force       : ${FORCE:-no}"
          echo "  Symbols     : ${INPUT_SYMBOLS:-<auto by sector>}"
          echo "=========================================="
          python ai_analyzer.py \
            --mode "$MODE" \
            --batch "$BATCH" \
            --total-batches "$TOTAL_BATCHES" \
            --no-ai \
            $FORCE

      # ============================================================
      # NHÁNH 2: AI (có gọi API)
      # Chạy khi: user chọn 'yes' HOẶC (không phải 'no' và có key)
      # ============================================================
      - name: Run Analysis (AI)
        if: |
          inputs.use_ai == 'yes' ||
          (inputs.use_ai != 'no' && secrets.ALIBABA_API_KEY != '')
        env:
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
          INPUT_SYMBOLS: ${{ inputs.symbols }}
          PYTHONUNBUFFERED: 1
          MODE: ${{ inputs.mode || 'top' }}
          BATCH: ${{ inputs.batch || '1' }}
          TOTAL_BATCHES: ${{ inputs.total_batches || '1' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          echo "=========================================="
          echo "🤖 CHẾ ĐỘ: AI (qwen3.7-max)"
          echo "  Mode        : $MODE"
          echo "  Batch       : $BATCH/$TOTAL_BATCHES"
          echo "  Force       : ${FORCE:-no}"
          echo "  Symbols     : ${INPUT_SYMBOLS:-<auto by sector>}"
          echo "=========================================="
          python ai_analyzer.py \
            --mode "$MODE" \
            --batch "$BATCH" \
            --total-batches "$TOTAL_BATCHES" \
            --ai \
            $FORCE

      - name: Commit and push results
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add data.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Không có thay đổi để commit."
          else
            LABEL="${{ inputs.symbols || (inputs.mode == 'rest' && format('Rest {0}/{1}', inputs.batch, inputs.total_batches)) || 'Top ngành' }}"
            MODE_LABEL="${{ inputs.use_ai || 'auto' }}"
            git commit -m "🤖 [${MODE_LABEL}] ${LABEL} [$(date +'%Y-%m-%d %H:%M')]"
            git push
          fi

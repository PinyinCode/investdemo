name: 2. Run Quant Screener

on:
  push:
    paths:
      - 'last_update.json'             
      - 'history/**'                   
      - 'symbol_sim_rates.json'        
      - 'quarterly_mean_details.json'  
  workflow_dispatch:                   

permissions:
  contents: write

# Xếp hàng chờ, không chạy song song
concurrency:
  group: "main-branch-queue"
  cancel-in-progress: false

jobs:
  screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Advanced Quant Screener
        run: python advanced_screener.py

      - name: Commit and push screener results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          git add screener_results.json screener_summary.csv data.json
          
          # Nếu không có thay đổi thì bỏ qua
          git diff --quiet && git diff --staged --quiet && echo "No changes to commit" && exit 0
          
          git commit -m "📊 [Screener] Cập nhật kết quả định lượng mới [$(date +'%Y-%m-%d')]"
          
          git pull --rebase origin main || echo "No rebase needed or handled"
          
          git push origin main

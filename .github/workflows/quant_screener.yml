name: 2. Run Quant Screener & Simulator

on:
  push:
    paths:
      - 'last_update.json'             
      - 'history/**'                   
  workflow_dispatch:                   

permissions:
  contents: write

# Xếp hàng chờ, không chạy song song
concurrency:
  group: "main-branch-queue"
  cancel-in-progress: false

jobs:
  data_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: 1. Run Advanced Quant Screener
        run: python advanced_screener.py
        
      - name: 2. Run Simulator (Calculate historical CAGR)
        run: python simulator.py

      - name: 3. Commit and push all data results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # Thêm TẤT CẢ các file kết quả (bao gồm cả screener và simulator)
          # Nếu simulator của bạn sinh ra file nào khác, hãy thêm vào đây
          git add screener_results.json screener_summary.csv data.json
          git add symbol_sim_rates.json quarterly_mean_details.json
          
          # Nếu không có thay đổi nào thì bỏ qua để tránh commit rác
          git diff --quiet && git diff --staged --quiet && echo "No changes to commit" && exit 0
          
          git commit -m "📊 [Data] Cập nhật Screener & Simulator [$(date +'%Y-%m-%d %H:%M')]"
          
          git pull --rebase origin main || echo "No rebase needed or handled"
          
          git push origin main

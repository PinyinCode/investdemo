name: 3. Build & Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Cấp quyền cho GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Tự động hủy các luồng cũ đang chạy dở để nhường chỗ cho luồng mới nhất
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Build HTML
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          echo "🚀 Bắt đầu build..."
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "❌ LỖI: Chưa cài đặt secret FIREBASE_CONFIG trên GitHub!"
            exit 1
          fi
          python giaodien_main.py
          echo "✅ Build thành công!"

      - name: Prepare for Pages
        run: |
          # Tạo thư mục _site để chứa các file cần deploy
          mkdir -p _site
          
          # Copy file HTML chính
          cp index.html _site/
          
          # Copy các file dữ liệu JSON, JS, CSS nếu có
          for f in data.json screener_results.json cheap_stocks.json \
                   symbol_sim_rates.json quarterly_mean_details.json \
                   last_update.json lightweight-charts.js vn100_full_info.json; do
            [ -f "$f" ] && cp "$f" _site/
          done
          
          # Copy thư mục history (chứa dữ liệu biểu đồ)
          if [ -d "history" ]; then
            cp -r history _site/
          fi
          
          echo "📁 Danh sách file chuẩn bị deploy:"
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

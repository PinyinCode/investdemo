name: Build & Auto Commit index.html

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Build HTML
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          echo "Kiểm tra FIREBASE_CONFIG:"
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "❌ LỖI: Chưa cài đặt secret FIREBASE_CONFIG trên GitHub!"
            exit 1
          fi
          python giaodien_main.py

      - name: Commit and Push index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Chỉ add file index.html và các file JSON dữ liệu (nếu có thay đổi)
          git add index.html
          git add quarterly_mean_details.json
          git add symbol_sim_rates.json
          
          # Kiểm tra xem có gì thay đổi trong khu vực staging không
          if git diff --staged --quiet; then
            echo "Không có thay đổi nào để commit."
          else
            git commit -m "Auto-build: Cập nhật index.html và dữ liệu"
            git push
          fi

name: Fix MongoDB Prices (Divide by 1000)

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  fix-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo

      - name: Run Fix Script
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }} # Lấy từ Github Secrets
        run: python fix_db.py

name: Render UI & Calculate Rates Automatically

on:
  workflow_dispatch: 
  push:
    paths:
      - 'render_ui.py'
      - 'simulator.py'
      - 'screener_results.json'
      - 'history/**'

permissions:
  contents: write

jobs:
  render-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      # Chạy render_ui.py (bên trong render_ui.py đã gọi run_complex_backtest_simulation() để tính toán từng mã)
      - name: Run Python Scripts
        run: python render_ui.py

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html symbol_sim_rates.json
          git commit -m "📊 Auto-calculate symbol rates & render index.html via Python" || exit 0
          git push

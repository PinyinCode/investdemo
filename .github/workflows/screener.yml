name: Pro Quant Screener Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Chạy định kỳ hàng tuần vào Thứ Hai

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy

      - name: Run Quantitative Screener
        run: python screener.py

      - name: Run AI Deep Analysis (Qwen 3.7 max)
        env:
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
        run: python ai_screener.py

      - name: Generate Frontend UI Automatically via Python
        run: python render_ui.py

      - name: Commit and push results to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add screener_results.json data.json index.html
          git commit -m "🤖 Auto-update Quant Screener & UI via Python Workflow" || exit 0
          git push

name: Render UI Automatically

on:
  workflow_dispatch: 
  push:
    paths:
      - 'render_ui.py'
      - 'screener_results.json'

# 👇 THÊM PHẦN PERMISSIONS NÀY VÀO ĐỂ CẤP QUYỀN GHI CHO BOT
permissions:
  contents: write

jobs:
  render-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run UI Renderer Script
        run: python render_ui.py

      - name: Commit and push generated HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "🎨 Auto-render index.html via Python" || exit 0
          git push

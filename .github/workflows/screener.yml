name: 1. Render UI & Calculate Rates Automatically

on:
  workflow_dispatch:
  push:
    paths:
      - 'render_ui.py'
      - 'simulator.py'
      - 'screener_results.json'
      - 'last_update.json'             # Kích hoạt khi cào dữ liệu thủ công
      - 'history/**'                   # Kích hoạt khi Server chốt sổ nến

permissions:
  contents: write

# CHỐNG KẸT: Tự động hủy tiến trình cũ nếu có tiến trình mới được kích hoạt
concurrency:
  group: "pages-render-ui"
  cancel-in-progress: true

jobs:
  render-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Cần fetch toàn bộ lịch sử để rebase mượt mà

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Python Scripts
        env:
          # 🔐 Firebase config được inject từ GitHub Secret (JSON string)
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          echo "🔄 Đang chạy script tính toán lãi suất (simulator.py)..."
          python simulator.py

          echo "🎨 Đang chạy script render giao diện (render_ui.py)..."
          python render_ui.py

      - name: Force Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add các file cần thiết
          git add index.html symbol_sim_rates.json quarterly_mean_details.json

          # Ép commit (kể cả khi không có thay đổi) bằng --allow-empty
          git commit --allow-empty -m "📊 Auto-calculate symbol rates & details, then render index.html via Python [$(date +'%Y-%m-%d %H:%M:%S')]"
          
          # Kéo code mới nhất từ remote về và rebase trước khi push
          echo "🔄 Đang pull --rebase để đồng bộ với remote..."
          git pull --rebase origin main || echo "No rebase needed"
          
          echo "🚀 Đang push lên Github..."
          git push origin main

name: Update VN100 List

on:
  schedule:
    # Chạy vào 8:00 sáng thứ 2 hàng tuần (giờ VN) = 1:00 UTC
    - cron: '0 1 * * 1'
  workflow_dispatch:  # Cho phép chạy thủ công từ tab Actions

permissions:
  contents: write

concurrency:
  group: update-vn100
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update VN100
        env:
          PYTHONUNBUFFERED: 1
        run: python update_vn100.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f symbols.json ]; then
            git add symbols.json
          fi

          if git diff --staged --quiet; then
            echo "ℹ️ Không có thay đổi trong symbols.json — bỏ qua commit."
            exit 0
          fi

          git commit -m "chore: update VN100 symbols list $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
